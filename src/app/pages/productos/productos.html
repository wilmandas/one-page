<section class="py-4" style="background: #f8fafc; min-height: 80vh;">
    <div class="container" style="max-width: 1200px;">

        <div class="mb-4">
            <h1 class="fw-bold mb-1" style="color: #0f172a; font-size: 2rem;">🛍️ Productos</h1>
            <p class="text-muted mb-0">Descubre nuestra selección de productos</p>
        </div>

        <div class="bg-white p-3 mb-4" style="border-radius: 16px; border: 1px solid #e2e8f0;">
            <div class="row g-2">
                <div class="col-md-6">
                    <input type="text" [(ngModel)]="busqueda" (input)="filtrar()"
                           class="form-control" placeholder="🔍 Buscar producto..."
                           style="border-radius: 10px; padding: .65rem 1rem; border: 2px solid #e2e8f0;">
                </div>
                <div class="col-md-6 d-flex gap-2 flex-wrap">
                    <button *ngFor="let cat of categorias"
                            (click)="seleccionarCategoria(cat)"
                            class="btn btn-sm fw-bold"
                            [style.background]="categoriaSeleccionada === cat ? '#7c3aed' : '#f1f5f9'"
                            [style.color]="categoriaSeleccionada === cat ? '#fff' : '#334155'"
                            style="border-radius: 10px;">
                        {{ cat }}
                    </button>
                </div>
            </div>
        </div>

        <div *ngIf="cargando" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3 text-muted">Cargando productos...</p>
        </div>

        <div *ngIf="!cargando && productosFiltrados.length === 0" class="text-center py-5">
            <div style="font-size: 3rem;">📦</div>
            <p class="text-muted mt-2">No se encontraron productos</p>
            <p class="text-muted small">Verifica que JSON Server esté corriendo con: <code>npm run api</code></p>
        </div>

        <div class="row g-3" *ngIf="!cargando && productosFiltrados.length > 0">
            <div class="col-md-6 col-lg-4 col-xl-3" *ngFor="let p of productosFiltrados">
                <div class="bg-white h-100 d-flex flex-column" style="border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden;">
                    <div style="height: 200px; overflow: hidden; background: #f1f5f9;">
                        <img [src]="p.imagen" [alt]="p.nombre"
                             style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div class="p-3 d-flex flex-column flex-grow-1">
                        <span class="badge align-self-start mb-2" style="background: #ede9fe; color: #7c3aed; font-size: 11px;">
                            {{ p.categoria }}
                        </span>
                        <h6 class="fw-bold mb-1" style="color: #0f172a; font-size: 14px;">{{ p.nombre }}</h6>
                        <p class="text-muted mb-2" style="font-size: 12px;">{{ p.descripcion }}</p>
                        <div class="mt-auto">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="fw-bold" style="color: #7c3aed; font-size: 1.25rem;">
                                    S/ {{ p.precio | number:'1.2-2' }}
                                </span>
                                <span class="text-muted" style="font-size: 11px;">Stock: {{ p.stock }}</span>
                            </div>
                            <button (click)="agregarAlCarrito(p)"
                                    class="btn w-100 fw-bold text-white"
                                    style="background: #7c3aed; border-radius: 10px; font-size: 13px;">
                                <i class="bi bi-cart-plus"></i> Agregar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>
