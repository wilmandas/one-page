<section class="py-5" style="background: #f8fafc; min-height: 80vh;">
    <div class="container" style="max-width: 800px;">

        <div class="mb-4">
            <h1 class="fw-bold mb-1" style="color: #0f172a; font-size: 1.75rem;">🧾 Pagar servicio</h1>
            <p class="text-muted mb-0">Paga tus servicios básicos al instante</p>
        </div>

        <div class="bg-white p-4 mb-4" style="border-radius: 20px; border: 1px solid #e2e8f0;">
            <h5 class="fw-bold mb-3">1. Selecciona el servicio</h5>
            <div class="row g-2">
                <div class="col-6 col-md-4" *ngFor="let s of servicios">
                    <button (click)="seleccionar(s)"
                            class="btn w-100 text-start p-3"
                            [style.background]="servicioSeleccionado?.codigo === s.codigo ? '#f5f3ff' : '#f8fafc'"
                            [style.border]="servicioSeleccionado?.codigo === s.codigo ? '2px solid #7c3aed' : '2px solid #e2e8f0'"
                            style="border-radius: 12px;">
                        <div class="d-flex align-items-center gap-2">
                            <span style="font-size: 1.5rem;">{{ s.icon }}</span>
                            <div>
                                <div class="fw-bold" style="font-size: 13px; color: #0f172a;">{{ s.nombre }}</div>
                                <div class="text-muted" style="font-size: 11px;">{{ s.codigo }}</div>
                            </div>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <div *ngIf="servicioSeleccionado" class="bg-white p-4" style="border-radius: 20px; border: 1px solid #e2e8f0;">

            <div *ngIf="exito" class="alert alert-success fw-bold mb-3" style="border-radius: 10px;">{{ exito }}</div>
            <div *ngIf="error" class="alert alert-danger fw-bold mb-3" style="border-radius: 10px;">{{ error }}</div>

            <h5 class="fw-bold mb-3">2. Datos del pago</h5>

            <div *ngIf="misEntidades.length === 0" class="alert alert-warning mb-3" style="border-radius: 10px;">
                <i class="bi bi-info-circle-fill"></i> No tienes entidades vinculadas.
                <a href="/mis-entidades" class="fw-bold" style="color: #7c3aed;">Vincular ahora</a>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold" style="font-size: 12px; text-transform: uppercase;">Cuenta de origen</label>
                <select [(ngModel)]="entidadOrigen" class="form-select"
                        style="border-radius: 10px; border: 2px solid #e2e8f0; padding: .75rem 1rem;">
                    <option *ngFor="let e of misEntidades" [value]="e.id">
                        {{ e.codigo }} · {{ e.numero }} · S/ {{ e.saldo }}
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold" style="font-size: 12px; text-transform: uppercase;">Número de recibo</label>
                <input type="text" [(ngModel)]="numeroRecibo" class="form-control"
                       placeholder="Ej: 1234567890"
                       style="border-radius: 10px; border: 2px solid #e2e8f0; padding: .75rem 1rem;">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold" style="font-size: 12px; text-transform: uppercase;">Monto (S/)</label>
                <input type="number" [(ngModel)]="monto" class="form-control" placeholder="0.00"
                       style="border-radius: 10px; border: 2px solid #e2e8f0; padding: .75rem 1rem;">
            </div>

            <button (click)="pagar()" [disabled]="loading" class="btn w-100 fw-bold text-white py-3"
                    style="background: #7c3aed; border-radius: 12px;">
                <span *ngIf="!loading"><i class="bi bi-check-circle-fill"></i> Pagar {{ servicioSeleccionado.nombre }}</span>
                <span *ngIf="loading"><span class="spinner-border spinner-border-sm"></span> Procesando...</span>
            </button>
        </div>

    </div>
</section>
