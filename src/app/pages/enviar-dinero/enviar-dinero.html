<section class="py-5" style="background: #f8fafc; min-height: 80vh;">
    <div class="container" style="max-width: 520px;">

        <div class="mb-4">
            <a routerLink="/dashboard" class="text-decoration-none small fw-bold" style="color: #7c3aed;">
                <i class="bi bi-arrow-left"></i> Volver al Dashboard
            </a>
            <h1 class="fw-bold mb-1 mt-2" style="color: #0f172a; font-size: 1.75rem;">
                <i class="bi bi-send-fill" style="color: #7c3aed;"></i> Enviar dinero
            </h1>
            <p class="text-muted mb-0">Envía dinero a cualquier usuario de ONE-PAGE</p>
        </div>

        <div class="bg-white p-4" style="border-radius: 20px; border: 1px solid #e2e8f0;">

            <div *ngIf="misEntidades.length === 0" class="alert alert-warning mb-3" style="border-radius: 10px;">
                <i class="bi bi-info-circle-fill"></i> No tienes entidades vinculadas.
                <a routerLink="/mis-entidades" class="fw-bold" style="color: #7c3aed;">Vincular ahora</a>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold" style="font-size: 12px; text-transform: uppercase;">Cuenta de origen</label>
                <select [(ngModel)]="entidadOrigen" class="form-select"
                        style="border-radius: 10px; border: 2px solid #e2e8f0; padding: .75rem 1rem;">
                    <option [ngValue]="null">-- Selecciona --</option>
                    <option *ngFor="let e of misEntidades" [ngValue]="e.id">
                        {{ e.codigo }} · {{ e.numero }} · S/ {{ e.saldo }}
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold" style="font-size: 12px; text-transform: uppercase;">
                    Celular o N° de cuenta del destinatario
                </label>
                <input type="text" [(ngModel)]="destinatario" class="form-control"
                       placeholder="Ej: 987654321 o 7565741957"
                       style="border-radius: 10px; border: 2px solid #e2e8f0; padding: .75rem 1rem;">
                <small class="text-muted" style="font-size: 11px;">
                    <i class="bi bi-info-circle"></i> Puedes ingresar el celular o el número de cuenta
                </small>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold" style="font-size: 12px; text-transform: uppercase;">Monto (S/)</label>
                <input type="number" [(ngModel)]="monto" class="form-control" placeholder="0.00"
                       style="border-radius: 10px; border: 2px solid #e2e8f0; padding: .75rem 1rem;">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold" style="font-size: 12px; text-transform: uppercase;">Concepto (opcional)</label>
                <input type="text" [(ngModel)]="concepto" class="form-control" placeholder="Ej: Pago de almuerzo"
                       style="border-radius: 10px; border: 2px solid #e2e8f0; padding: .75rem 1rem;">
            </div>

            <button (click)="enviar()" [disabled]="loading" class="btn w-100 fw-bold text-white py-3"
                    style="background: #7c3aed; border-radius: 12px;">
                <span *ngIf="!loading"><i class="bi bi-send-fill"></i> Enviar dinero</span>
                <span *ngIf="loading"><span class="spinner-border spinner-border-sm"></span> Enviando...</span>
            </button>

        </div>

    </div>
</section>
