<section class="py-5" style="background: #f8fafc; min-height: 80vh;">
    <div class="container" style="max-width: 900px;">

        <div class="mb-5 text-center">
            <h1 class="fw-bold mb-2" style="color: #0f172a; font-size: 2rem;">
                <i class="bi bi-envelope-fill" style="color: #7c3aed;"></i> Contáctanos
            </h1>
            <p class="text-muted">Estamos aquí para ayudarte</p>
        </div>

        <!-- Info -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="bg-white p-4 text-center" style="border-radius: 16px; border: 1px solid #e2e8f0;">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3"
                         style="width: 56px; height: 56px; background: #ede9fe; border-radius: 16px; font-size: 1.5rem; color: #7c3aed;">
                        <i class="bi bi-envelope-fill"></i>
                    </div>
                    <h6 class="fw-bold mb-1">Email</h6>
                    <p class="text-muted mb-0" style="font-size: 13px;">info@onepage.pe</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="bg-white p-4 text-center" style="border-radius: 16px; border: 1px solid #e2e8f0;">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3"
                         style="width: 56px; height: 56px; background: #d1fae5; border-radius: 16px; font-size: 1.5rem; color: #059669;">
                        <i class="bi bi-phone-fill"></i>
                    </div>
                    <h6 class="fw-bold mb-1">Teléfono</h6>
                    <p class="text-muted mb-0" style="font-size: 13px;">+51 987 654 321</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="bg-white p-4 text-center" style="border-radius: 16px; border: 1px solid #e2e8f0;">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3"
                         style="width: 56px; height: 56px; background: #fef3c7; border-radius: 16px; font-size: 1.5rem; color: #d97706;">
                        <i class="bi bi-geo-alt-fill"></i>
                    </div>
                    <h6 class="fw-bold mb-1">Oficina</h6>
                    <p class="text-muted mb-0" style="font-size: 13px;">Lima, Perú</p>
                </div>
            </div>
        </div>

        <!-- Formulario -->
        <div class="bg-white p-4 p-md-5" style="border-radius: 20px; border: 1px solid #e2e8f0;">
            <h3 class="fw-bold mb-4" style="font-size: 1.3rem;">Envíanos un mensaje</h3>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold" style="font-size: 12px; text-transform: uppercase;">Nombre</label>
                    <input type="text" [(ngModel)]="nombre" class="form-control" placeholder="Tu nombre completo"
                           style="border-radius: 10px; border: 2px solid #e2e8f0; padding: .75rem 1rem;">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold" style="font-size: 12px; text-transform: uppercase;">Email</label>
                    <input type="email" [(ngModel)]="email" class="form-control" placeholder="tu@email.com"
                           style="border-radius: 10px; border: 2px solid #e2e8f0; padding: .75rem 1rem;">
                </div>
                <div class="col-12">
                    <label class="form-label fw-bold" style="font-size: 12px; text-transform: uppercase;">Mensaje</label>
                    <textarea [(ngModel)]="mensaje" class="form-control" rows="5" 
                              placeholder="Cuéntanos en qué podemos ayudarte"
                              style="border-radius: 10px; border: 2px solid #e2e8f0; padding: .75rem 1rem;"></textarea>
                </div>
            </div>

            <button (click)="enviar()" class="btn fw-bold text-white mt-4 py-3 px-4"
                    style="background: #7c3aed; border-radius: 12px;">
                <i class="bi bi-send-fill"></i> Enviar mensaje
            </button>
        </div>

    </div>
</section>
